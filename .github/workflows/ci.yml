name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    # Postgres de verdade para os testes do SQL (RLS, funções atômicas, views).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Testes (unitários + SQL em Postgres real)
        run: pytest -q

      - name: Imagem Docker compila
        run: docker build --target producao -t estudos-ia:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos (TypeScript) e build de produção
        run: npm run build

      - name: Proibido HTML injetado fora do gráfico do shadcn
        run: |
          if grep -rn "dangerouslySetInnerHTML" src --include=*.tsx | grep -v "src/components/ui/chart.tsx"; then
            echo "Use texto puro: dangerouslySetInnerHTML abre brecha para XSS." && exit 1
          fi
